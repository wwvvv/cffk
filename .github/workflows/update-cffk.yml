name: Update CFFK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-cffk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout instance repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream without overwriting instance customizations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CFFK Updater"
          git config user.email "actions@github.com"
          previous_sha="$(git rev-parse HEAD)"
          git fetch https://github.com/34892002/cffk.git main

          # A merge preserves local payment, Worker and workflow customizations.
          # Conflicts fail closed: resolve them manually before releasing.
          if ! git merge --no-ff --no-edit FETCH_HEAD; then
            git merge --abort || true
            echo "::error::Upstream changes conflict with instance customizations. Review and merge manually."
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" = "$previous_sha" ]; then
            echo "CFFK is already up to date."
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
