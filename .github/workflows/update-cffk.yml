name: Update CFFK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-cffk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout instance repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        shell: bash
        run: |
          set -euo pipefail

          # Preserve instance-specific Cloudflare settings and deployment workflows.
          for file in wrangler.jsonc .github/workflows/deploy-cloudflare.yml .github/workflows/update-cffk.yml; do
            if [ -f "$file" ]; then
              mkdir -p "$RUNNER_TEMP/cffk-preserved/$(dirname "$file")"
              cp "$file" "$RUNNER_TEMP/cffk-preserved/$file"
            fi
          done

          git fetch https://github.com/34892002/cffk.git main
          git reset --hard FETCH_HEAD
          upstream_sha="$(git rev-parse --short HEAD)"

          for file in wrangler.jsonc .github/workflows/deploy-cloudflare.yml .github/workflows/update-cffk.yml; do
            if [ -f "$RUNNER_TEMP/cffk-preserved/$file" ]; then
              mkdir -p "$(dirname "$file")"
              cp "$RUNNER_TEMP/cffk-preserved/$file" "$file"
            fi
          done

          git config user.name "CFFK Updater"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "CFFK is already up to date."
          else
            git add -A
            git commit -m "Update CFFK to ${upstream_sha}"
          fi

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
