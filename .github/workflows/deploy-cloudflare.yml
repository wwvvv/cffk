name: Deploy CFFK to Cloudflare mail

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cffk-mail-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check deployment secrets
        shell: bash
        env:
          CFFK_ADMIN_PATH: ${{ secrets.CFFK_ADMIN_PATH }}
          CFFK_BETTER_AUTH_SECRET: ${{ secrets.CFFK_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CFFK_ADMIN_PATH CFFK_BETTER_AUTH_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Actions secret $name is missing"
              exit 1
            fi
          done
      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq -e '.success == true and .result.status == "active"' > /dev/null; then
            echo "::error::Cloudflare API token is invalid or inactive. Replace CLOUDFLARE_API_TOKEN in GitHub Actions Secrets."
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run core tests
        run: bun test tests/core
      - name: Build application
        run: bun run build
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply DB --remote
      - name: Seed initial settings (idempotent)
        run: bunx wrangler d1 execute DB --remote --file=./scripts/seed.sql --yes
      - name: Deploy Worker
        run: bunx wrangler deploy
      - name: Set runtime secrets
        shell: bash
        env:
          CFFK_ADMIN_PATH: ${{ secrets.CFFK_ADMIN_PATH }}
          CFFK_BETTER_AUTH_SECRET: ${{ secrets.CFFK_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$CFFK_ADMIN_PATH" | bunx wrangler secret put ADMIN_PATH
          printf '%s' "$CFFK_BETTER_AUTH_SECRET" | bunx wrangler secret put BETTER_AUTH_SECRET
